name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build packages
        run: npm run build

      - name: Typecheck packages/db
        run: npm run typecheck -w packages/db

      - name: Typecheck apps/auralabels
        run: npm run typecheck -w apps/auralabels

      - name: Run tests (apps/auralabels)
        run: npm run test -w apps/auralabels

      - name: Run tests (packages/db)
        run: npm run test -w packages/db

  deploy:
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate CLOUDFLARE_API_TOKEN is set
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is set ✓"

      - name: Validate Worker secrets are available
        run: |
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "::error::JWT_SECRET secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "::error::PRODUCTION_DATABASE_URL secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}" ]; then
            echo "::error::BOOTSTRAP_ADMIN_USERNAME secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}" ]; then
            echo "::error::BOOTSTRAP_ADMIN_PASSWORD secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set — AI generation will fall back to Workers AI only"
          else
            echo "OPENROUTER_API_KEY is set ✓"
          fi
          echo "All Worker secrets are set ✓"

      - name: Deploy all Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Push secrets to Worker (idempotent, safe to run every deploy)
        run: |
          printf '%s' "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET --name aura
          printf '%s' "${{ secrets.PRODUCTION_DATABASE_URL }}" | npx wrangler secret put DATABASE_URL --name aura
          printf '%s' "${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}" | npx wrangler secret put BOOTSTRAP_ADMIN_USERNAME --name aura
          printf '%s' "${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}" | npx wrangler secret put BOOTSTRAP_ADMIN_PASSWORD --name aura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Push OPENROUTER_API_KEY to Worker (optional)
        run: |
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            printf '%s' "${{ secrets.OPENROUTER_API_KEY }}" | npx wrangler secret put OPENROUTER_API_KEY --name aura
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Push HCAPTCHA_SECRET_KEY to Worker (optional)
        run: |
          if [ -n "${{ secrets.HCAPTCHA_SECRET_KEY }}" ]; then
            printf '%s' "${{ secrets.HCAPTCHA_SECRET_KEY }}" | npx wrangler secret put HCAPTCHA_SECRET_KEY --name aura
            echo "HCAPTCHA_SECRET_KEY is set ✓"
          else
            echo "::warning::HCAPTCHA_SECRET_KEY is not set — registration form will skip CAPTCHA verification"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy auralabels frontend to Cloudflare Pages
        run: npm run deploy:pages -w apps/auralabels
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  migrate:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Apply Drizzle migrations
        run: npm run migrate -w packages/db
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

