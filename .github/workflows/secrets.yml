name: Sync Worker secrets

on:
  workflow_dispatch:

jobs:
  sync-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set JWT_SECRET on Worker
        run: echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET --name aura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set DATABASE_URL on Worker
        run: echo "${{ secrets.PRODUCTION_DATABASE_URL }}" | npx wrangler secret put DATABASE_URL --name aura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set BOOTSTRAP_ADMIN_USERNAME on Worker
        run: echo "${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}" | npx wrangler secret put BOOTSTRAP_ADMIN_USERNAME --name aura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set BOOTSTRAP_ADMIN_PASSWORD on Worker
        run: echo "${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}" | npx wrangler secret put BOOTSTRAP_ADMIN_PASSWORD --name aura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set OPENROUTER_API_KEY on Worker
        run: echo "${{ secrets.OPENROUTER_API_KEY }}" | npx wrangler secret put OPENROUTER_API_KEY --name aura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set HCAPTCHA_SECRET_KEY on Worker
        run: echo "${{ secrets.HCAPTCHA_SECRET_KEY }}" | npx wrangler secret put HCAPTCHA_SECRET_KEY --name aura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
